# Nginx reverse proxy for the Prompto backend.
# HTTP-only on purpose: `certbot --nginx` rewrites this file in place to add the
# SSL block, the 443 listener, and the http->https redirect. Do not add SSL by
# hand — run certbot (see deploy/AZURE_DEPLOY.md).
#
# Change server_name to your API subdomain, then:
#   sudo cp deploy/nginx/prompto-api.conf /etc/nginx/sites-available/prompto-api
#   sudo ln -sf /etc/nginx/sites-available/prompto-api /etc/nginx/sites-enabled/prompto-api
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name prompto-api.keshavkashyap.me;

    # Document uploads (pdf/docx) flow through here; keep in step with the
    # Python service's MAX_BODY_BYTES and the backend's multer limits.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI calls can be slow; give them room before nginx times out.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
