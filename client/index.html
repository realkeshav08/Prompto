<!doctype html>
<!-- Single HTML shell for the whole SPA. Browser loads this → runs main.jsx →
     React mounts the app inside #root. Vite uses this file as the build entry. -->
<html lang="en">
  <!-- lang: screen-reader pronunciation + SEO -->

  <head>
    <!-- UTF-8, near the top so bytes decode correctly from first paint -->
    <meta charset="UTF-8" />

    <!-- Tab icon (local, no CDN) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Responsive: match page width to device width (mobile) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Mobile address-bar colour = dark theme (matches --color-bg dark) -->
    <meta name="theme-color" content="#030712" />

    <!-- Boot loader styles: a pure-CSS spinner shown INSTANTLY on first paint,
         before any JS loads (kills the white screen on slow networks). React
         wipes #root on mount, so this disappears automatically. Committed to the
         dark theme since the chosen theme (localStorage) isn't readable pre-JS. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030712;
      }
      #boot-loader .boot-spin {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid rgba(129, 140, 248, 0.2);
        border-top-color: #818cf8;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- ===== PWA: iOS "Add to Home Screen" (iOS ignores the web manifest) ===== -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prompto" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" /><!-- 180×180 -->

    <!-- Production canonical URL (SEO + share links) -->
    <link rel="canonical" href="https://prompto.keshavkashyap.me" />

    <!-- Perf: open Google Fonts connection early (before CSS asks) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Loaded here rather than @import-ed from index.css: an @import must
         resolve before the rest of the bundle applies, so a slow font response
         paints the app half-styled. As its own link it downloads in parallel and
         only swaps the typeface in when ready. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- CSP is set in vercel.json (HTTP header), NOT here — a strict <meta> CSP
         would block Vite's dev hot-reload (inline scripts + eval). -->

    <!-- ============================ SEO ============================ -->
    <title>Prompto — Your AI Study Partner</title>
    <meta
      name="description"
      content="Prompto is your AI study partner — upload your notes, ask questions, and get clear explanations for any subject."
    />

    <!-- =================== Social link previews =================== -->
    <!-- Open Graph: WhatsApp / Facebook / LinkedIn / Slack cards -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prompto.keshavkashyap.me" />
    <meta property="og:site_name" content="Prompto" />
    <meta property="og:title" content="Prompto — Your AI Study Partner" />
    <meta
      property="og:description"
      content="Upload your notes, ask questions, and get clear explanations for any subject."
    />
    <!-- OG image must be an ABSOLUTE url (crawlers can't resolve relative paths) -->
    <meta property="og:image" content="https://prompto.keshavkashyap.me/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Prompto — Your AI Study Partner" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@keshavkashyappp" />
    <meta name="twitter:creator" content="@keshavkashyappp" />
    <meta name="twitter:title" content="Prompto — Your AI Study Partner" />
    <meta
      name="twitter:description"
      content="Upload your notes, ask questions, and get clear explanations for any subject."
    />
    <meta name="twitter:image" content="https://prompto.keshavkashyap.me/og-image.png" />
  </head>

  <body>
    <!-- React mount point (id must match main.jsx).
         The boot loader inside is shown until React mounts and replaces #root. -->
    <div id="root">
      <div id="boot-loader"><div class="boot-spin"></div></div>
    </div>

    <!-- Fallback when JS is disabled (this is a JS-rendered app) -->
    <noscript>
      Please enable JavaScript to run Prompto. / Prompto chalane ke liye JavaScript enable karein.
    </noscript>

    <!-- App entry. module = ESM + deferred (runs after #root exists). Vite
         transforms .jsx in dev; swaps in the hashed bundle in the build. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
