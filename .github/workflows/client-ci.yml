name: Client CI

# Runs only when the client app changes (keeps server / python-service CI separate).
on:
  push:
    branches: [main, development]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm ci installs EXACTLY from package-lock.json (reproducible, fails on mismatch).
      - name: Install dependencies
        run: npm ci

      # Fail the build on any high (or worse) severity vulnerability.
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
